name: forkalope-3

topology:
  defaults:
    kind: linux
    image: forkalope/forge:lab

  nodes:
    node-001:
      cmd: >-
        -addr :8080 -data-dir /var/lib/forkalope -cluster-id forkalope-3
        -node-id node-001 -node-name node-001 -role forge -region lab-west
        -advertise-url http://node-001:8080
        -franchise-id franchise-1 -franchise-name franchise-1
        -federation-endpoint http://${FORKALOPE_FRANCHISE_1_HOST:-127.0.0.1}:8080
        -federation-peer http://${FORKALOPE_FRANCHISE_2_HOST:-127.0.0.1}:8180
        -federation-peer-id franchise-2
        -fabric-addresses 10.240.0.1,10.240.0.10
        -peers http://node-002:8080
      ports:
        - 8080:8080
      exec:
        - ip addr add 10.240.0.1/30 dev eth1
        - ip addr add 10.240.0.10/30 dev eth2

    node-002:
      cmd: >-
        -addr :8080 -data-dir /var/lib/forkalope -cluster-id forkalope-3
        -node-id node-002 -node-name node-002 -role forge -region lab-east
        -advertise-url http://node-002:8080
        -fabric-addresses 10.240.0.2,10.240.0.5
        -peers http://node-003:8080
      exec:
        - ip addr add 10.240.0.2/30 dev eth1
        - ip addr add 10.240.0.5/30 dev eth2

    node-003:
      cmd: >-
        -addr :8080 -data-dir /var/lib/forkalope -cluster-id forkalope-3
        -node-id node-003 -node-name node-003 -role forge -region lab-europe
        -advertise-url http://node-003:8080
        -fabric-addresses 10.240.0.6,10.240.0.9
        -peers http://node-001:8080
      exec:
        - ip addr add 10.240.0.6/30 dev eth1
        - ip addr add 10.240.0.9/30 dev eth2

  links:
    - endpoints: ["node-001:eth1", "node-002:eth1"]
    - endpoints: ["node-002:eth2", "node-003:eth1"]
    - endpoints: ["node-003:eth2", "node-001:eth2"]
