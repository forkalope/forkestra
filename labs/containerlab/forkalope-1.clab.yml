name: forkalope-1

topology:
  defaults:
    kind: linux
    image: forkalope/forge:lab

  nodes:
    node-001:
      cmd: >-
        -addr :8080 -data-dir /var/lib/forkalope -cluster-id forkalope-1
        -node-id node-001 -node-name node-001 -role forge -region lab-west
        -advertise-url http://node-001:8080
        -franchise-id franchise-1 -franchise-name franchise-1
        -federation-endpoint http://${FORKALOPE_FRANCHISE_1_HOST:-127.0.0.1}:8080
        -fabric-addresses 10.240.0.1
      ports:
        - 8080:8080
